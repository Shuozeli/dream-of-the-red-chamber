name: Build UI Artifact

on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - 'data/json/**'
      - 'data/parsed/**'
      - 'scripts/build_duckdb.py'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-artifact
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Setup Python (for build_duckdb.py)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install JS deps
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Build (sync-data → tsc → vite)
        # sync-data runs scripts/build_duckdb.py which constructs the
        # ui/public/hongloumeng.duckdb file from data/json/*.json.
        working-directory: ui
        run: pnpm build

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
