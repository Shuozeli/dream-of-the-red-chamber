<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dream of the Red Chamber</title>
    <style>
      /* Splash visible immediately, before any JS runs. Replaced when
         React mounts (#root's children get overwritten by createRoot). */
      html, body { margin: 0; height: 100%; background: #3d2817; }
      .splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        color: #f6d3a3; gap: 14px;
        font-family: 'Noto Serif SC', 'PingFang SC', 'Songti SC', system-ui, serif;
      }
      .splash h1 { font-size: 22px; margin: 0; font-weight: 500; }
      .splash p  { font-size: 13px; margin: 0; opacity: 0.7; }
      .spinner {
        width: 32px; height: 32px;
        border: 3px solid rgba(246,211,163,0.2);
        border-top-color: #f6d3a3;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash">
        <div class="spinner"></div>
        <h1>Dream of the Red Chamber</h1>
        <p>正在加载界面…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
